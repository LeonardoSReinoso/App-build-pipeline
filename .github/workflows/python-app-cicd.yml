name: PythonBuildPackage-CICD-POC

on: 
    workflow_dispatch:  

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Display structure of dirs
        run: ls -R
  
      - name: Extract zip
        uses: ihiroky/extract-action@v1
        with:
          file_path: ${{ github.workspace }}/app/task1/TASK1.zip
          extract_dir: task1package

      - name: Extract zip
        uses: ihiroky/extract-action@v1
        with:
            file_path: ${{ github.workspace }}/app/task2/TASK2.zip
            extract_dir: task2package

      - name: Displa Branch Name
        run: echo running on branch ===> ${GITHUB_REF##*/}
     
      - name: CopyTask2
        run: |
          cp task2package/* task1package/

      - uses: somaz94/compress-decompress@v1.0.3
        with:
            command: 'compress'
            source: task1package
            dest: task1
            format: zip
            includeRoot: false
                  
      - uses: actions/upload-artifact@v4
        with:
            name: zip-file
            path: task1

