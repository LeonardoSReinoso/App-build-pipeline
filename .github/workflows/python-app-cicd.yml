name: PythonBuildPackage-CICD-POC

on: 
    workflow_dispatch:  

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hoatruongdev09/extract-zip-github-action@v1.2
        with:
          input-path: "app/task1"
          output-path: 'task1package/'

      - uses: hoatruongdev09/extract-zip-github-action@v1.2
        with:
          input-path: "app/task2"
          output-path: 'task2package/'

      - name: Displa Branch Name
        run: echo running on branch ${GITHUB_REF##*/}
     
      - name: CopyTask2
        run: |
          cp app/task2package/* app/task1package/

      - uses: somaz94/compress-decompress@v1.0.3
        with:
            command: 'compress'
            source: 'app/task1package'
            dest: 'task1'
            format: zip
            includeRoot: false
                  
      - uses: actions/upload-artifact@v4
        with:
            name: zip-file
            path: task2

