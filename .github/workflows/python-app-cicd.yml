name: PythonBuildPackage-CICD-POC

on: 
    workflow_dispatch:  

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Display structure of dirs
        run: ls -R
  
      - name: Extract zip
        uses: ./
        with:
          file_path: ${{ github.workspace }}/app/task1/*.zip
          extract_dir: task2package
          verbose: true

      - name: Extract zip
        uses: ./
        with:
            file_path: ${{ github.workspace }}/app/task1/*.zip
            extract_dir: task2package
            verbose: true

      # - name:
      #   run:
      #     unzip -c "${{ github.workspace }}/app/task1/*.zip"
      #     unzip -c "${{ github.workspace }}/app/task2/*.zip"

      # - uses: hoatruongdev09/extract-zip-github-action@v1.2
      #   with:
      #     input-path: '${{ github.workspace }}/app/task2/task2.zip'
      #     output-path: '${{ github.workspace }}/app/task2package'

      - name: Displa Branch Name
        run: echo running on branch ${GITHUB_REF##*/}
     
      - name: CopyTask2
        run: |
          cp app/task2package/* app/task1package/

      - uses: somaz94/compress-decompress@v1.0.3
        with:
            command: 'compress'
            source: 'app/task1package'
            dest: 'task1'
            format: zip
            includeRoot: false
                  
      - uses: actions/upload-artifact@v4
        with:
            name: zip-file
            path: task2

